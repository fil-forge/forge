name: Container

# Publishes the mutable :main (and :sha-<short>) images on merge, per service,
# from the shared docker/Dockerfile.
#
# These are for humans and for the stack's default compose files: `make pull`,
# demos, and anyone who wants to run the stack without building it. PRs do NOT
# run this workflow — PR coverage is ci.yml's stack job, which builds the prod
# images from the PR's tree and boots the stack on them, so an unbuildable
# image fails the PR anyway.
#
# Every service publishes on every merge. This used to be path-filtered per
# service; that stopped being sound once the services shared in-repo modules
# and depended on one another (see ci.yml). With the gha build cache warm, an
# unchanged service's build is a near no-op, so the cost of always publishing
# is small and the cost of a stale image is not.
#
# The dev images (:main-dev) are published artifacts for ad-hoc engineer
# debugging (debug toolset + dlv; smelt's compose.debug.yml / make debug-<svc>
# flow) — built here on merge, never on PRs.
#
# Images are ghcr.io/fil-forge/forge/<service>, following the repo. The old
# ghcr.io/fil-forge/<service> packages are left in place so existing pulls and
# already-published snapshots keep resolving; the satellites' own repositories
# keep publishing theirs until they are retired.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: publish (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service:
          - piri
          - hilt
          - sprue
          - ingot
          - delegator
          - piri-signing-service
          - indexing-service
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      # Per-service parameters for the shared Dockerfile (see its header for
      # what MAIN_PKG, BIN and BUILD_TAGS mean).
      - name: Service build args
        id: args
        run: |
          extra=""
          case "${{ matrix.service }}" in
            piri)                 extra="BUILD_TAGS=skiff" ;;
            ingot)                extra="MAIN_PKG=./cmd/ingot" ;;
            delegator)            extra=$'MAIN_PKG=.\nBIN=registrar' ;;
            piri-signing-service) extra=$'MAIN_PKG=.\nBIN=signer' ;;
            indexing-service)     extra="BIN=indexer" ;;
          esac
          {
            echo "extra<<EOF"
            echo "$extra"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=${{ matrix.service }}
            ${{ steps.args.outputs.extra }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build and push (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          build-args: |
            SERVICE=${{ matrix.service }}
            ${{ steps.args.outputs.extra }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:main-dev
          cache-from: type=gha,scope=${{ matrix.service }}-dev
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-dev
