name: Container

# Publishes the mutable :main (and :sha-<short>) images on merge, per service,
# from the shared docker/Dockerfile.
#
# These are for humans and for the stack's default compose files: `make pull`,
# demos, and anyone who wants to run the stack without building it. PRs do NOT
# run this workflow — PR coverage is ci.yml's stack job, which builds the prod
# images from the PR's tree and boots the stack on them, so an unbuildable
# image fails the PR anyway.
#
# The dev images (:main-dev) are published artifacts for ad-hoc engineer
# debugging (debug toolset + dlv; smelt's compose.debug.yml / make debug-<svc>
# flow) — built here on merge, never on PRs.
#
# Images are ghcr.io/fil-forge/forge/<service>, following the repo. The old
# ghcr.io/fil-forge/<service> packages are left in place so existing pulls and
# already-published snapshots keep resolving.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      any: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            piri:
              - 'piri/**'
              - 'docker/**'
              - '.github/workflows/publish-ghcr.yml'
            hilt:
              - 'hilt/**'
              - 'docker/**'
              - '.github/workflows/publish-ghcr.yml'
            sprue:
              - 'sprue/**'
              - 'docker/**'
              - '.github/workflows/publish-ghcr.yml'
            ingot:
              - 'ingot/**'
              - 'docker/**'
              - '.github/workflows/publish-ghcr.yml'

  build:
    name: publish (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      # Per-service parameters for the shared Dockerfile.
      - name: Service build args
        id: args
        run: |
          extra=""
          case "${{ matrix.service }}" in
            piri)  extra="BUILD_TAGS=skiff" ;;
            ingot) extra="MAIN_PKG=./cmd/ingot" ;;
          esac
          echo "extra=$extra" >> "$GITHUB_OUTPUT"

      - name: Build and push (prod)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=${{ matrix.service }}
            ${{ steps.args.outputs.extra }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build and push (dev)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: docker/Dockerfile
          target: dev
          build-args: |
            SERVICE=${{ matrix.service }}
            ${{ steps.args.outputs.extra }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:main-dev
          cache-from: type=gha,scope=${{ matrix.service }}-dev
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-dev
