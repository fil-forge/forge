name: compat

# Does what we are about to ship still work against what is already deployed?
#
# `ci`, `itest` and `e2e` all boot this commit against itself, which is the
# guarantee the monorepo gives for free and is a development-time one. The
# field is a mix: we run sprue and hilt, third-party operators run piri and
# ingot and upgrade on their own schedule. This workflow tests that skew.
#
# IT RUNS ON A RELEASE PULL REQUEST, AND NOWHERE ELSE ON ITS OWN. A pull request
# from a `release/<svc>` branch is the one place the question has an answer
# somebody acts on: red means do not merge this release. The same run against
# `main` produces a result with no decision attached -- `main` is not deployed,
# so a red there leaves you working out which pending release it implicates.
#
# It takes no service. Unlike release.yml it tests the whole stack against the
# window, so a release pull request for any service gets the same run; the
# branch name is only the signal that a release is being proposed.
#
# THE ANSWER GOES STALE WITHOUT THE CODE CHANGING, which is why this file has no
# `schedule:` and `compat-refresh.yml` does. The pinned side is read live from
# the registry, so the same commit can face a different fleet tomorrow: an
# upstream release lands, the window moves, and a release pull request that was
# green is no longer known to be. That workflow re-runs THIS one on every open
# release pull request, daily. Re-runs, rather than starting a fresh run against
# the branch, because a re-run stays attached to the pull request and so lands
# the fresh answer where the merge decision is made.
#
# Also on demand.
#
# THE PINNED SIDE IS THE POLYREPOS' IMAGES -- ghcr.io/fil-forge/<svc>. Those
# are what ships to the network today, so they are what "already deployed"
# means. This repository publishes no images (images.yml runs with push: false)
# and carries no service-prefixed tags; neither is a prerequisite here, which
# is why this can run before the release-ownership question is settled.
#
# THE VERSION SET COMES FROM THE REGISTRY, not from git tags, because the two
# disagree: the polyrepos tag git `v0.2.4` and publish the image `0.2.4`.
# Reading the registry asks the question the test actually has -- "what can I
# pin against?" -- and cannot drift from it.

on:
  # No `branches:` filter would help: it matches the BASE branch, and what
  # selects a release here is the HEAD branch. The job condition below does it.
  pull_request:
  workflow_dispatch:
    inputs:
      window:
        description: 'How many recent releases per service to test against'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  window:
    name: Resolve the published window
    # A release pull request, or a dispatch. Every other pull request skips
    # this job, and `compat` needs it, so both skip together -- which costs an
    # ordinary pull request nothing, and matters because the compat job below
    # is capped at an hour.
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    # TWO JSON OBJECTS, not one entry per service. A hand-written list here was
    # wrong in both available directions at once: it named `base_sprue`, which
    # the test read as COMPAT_BASELINE_UPLOAD and never saw, and it omitted the
    # four services the fleet gained. `outputs:` cannot be generated, so the
    # thing that varies moves inside a value instead.
    outputs:
      baselines: ${{ steps.resolve.outputs.baselines }}
      windows: ${{ steps.resolve.outputs.windows }}
      pinnable: ${{ steps.resolve.outputs.pinnable }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions from the registry
        id: resolve
        env:
          N: ${{ inputs.window || '2' }}
        run: .github/scripts/compat-window.sh "$N" >> "$GITHUB_OUTPUT"

  compat:
    name: Version skew
    needs: window
    # Nothing to pin against is not a failure. A service that has not published
    # a release yet should not give this a permanent red.
    #
    # This skip is only safe because the script now FAILS when it cannot read
    # the registry, rather than reporting that as "no releases". It used to do
    # the latter, which made an outage look like this case: four "publishes no
    # version-tagged image" lines, pinnable=false, this job skipped, and the
    # run green having asserted nothing.
    if: needs.window.outputs.pinnable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            piri/go.sum
            hilt/go.sum
            sprue/go.sum
            ingot/go.sum
            smelt/go.sum

      # Expanded here rather than listed as `env:` entries, for the reason the
      # `outputs:` comment gives. The key is already the package name the test
      # asks for, so this adds no mapping of its own -- it writes exactly what
      # the registry answered.
      - name: Expand the resolved versions
        env:
          BASELINES: ${{ needs.window.outputs.baselines }}
          WINDOWS: ${{ needs.window.outputs.windows }}
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import json, os, re
          for var, prefix, suffix in (("BASELINES", "COMPAT_BASELINE_", ""),
                                      ("WINDOWS", "COMPAT_", "_VERSIONS")):
              for k, v in json.loads(os.environ[var]).items():
                  # The key comes from a package name the registry confirmed, so
                  # it cannot carry a newline -- but $GITHUB_ENV is parsed line
                  # by line, and a check here costs nothing.
                  assert re.fullmatch(r"[A-Z0-9_]+", k), k
                  assert "\n" not in v, v
                  print(f"{prefix}{k}{suffix}={v}")
          EOF
          echo "--- resolved ---"; grep '^COMPAT_' "$GITHUB_ENV"

      # GOWORK stays ON: the services NOT pinned to a released image are built
      # from HEAD by pkg/workspace, which is the whole point of the comparison.
      - name: Run compatibility suite
        working-directory: smelt
        run: go test -tags compat -v -timeout 55m -parallel 1 ./tests/compat/...

      - name: Dump container state on failure
        if: failure()
        run: |
          mkdir -p /tmp/container-logs
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "/tmp/container-logs/$c.log" 2>&1 || true
            echo "::group::$c"; tail -200 "/tmp/container-logs/$c.log"; echo "::endgroup::"
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-container-logs
          path: /tmp/container-logs/
          if-no-files-found: ignore
          retention-days: 7
