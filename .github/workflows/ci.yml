name: ci

# Minimal Phase 0 check: each module builds, vets, is tidy, and its tests
# pass, standalone (GOWORK=off). No Docker, no release/publish — that's
# later-phase work. Unfiltered on purpose: with only one job covering every
# module, there's no path-filter list to fall out of sync with a new shared
# module (see forge-consolidation-plan.md's Traps section, #1).

on:
  push:
  pull_request:
  # A workflow does not run for the commits that were already present when it
  # first appeared, so this repo's own main arrived unverified. Dispatch makes
  # a run possible without inventing a commit to trigger one.
  workflow_dispatch:

jobs:
  replaces:
    name: replaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: smelt/go.mod
          cache-dependency-path: smelt/go.sum
      - name: every in-repo require has a replace
        run: .github/scripts/check-replaces.sh
      - name: images.yml and e2e.yml build the same services
        run: .github/scripts/check-image-lists.sh
      - name: every setup-go step caches the module cache
        run: .github/scripts/check-setup-go-cache.sh
      - name: every Dockerfile retries its module download
        run: .github/scripts/check-dockerfile-retry.sh

  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          # piri needs -tags skiff to select curio's FFI-free variants; without
          # it the CGO-free build dies on undefined ffi.* symbols.
          - service: piri
            build_flags: -tags skiff
            cgo_enabled: "0"
          - service: hilt
            tagged_suites: itest
          - service: ingot
            tagged_suites: itest
          - service: sprue
          - service: smelt
            tagged_suites: e2e
          - service: delegator
          - service: piri-signing-service
    name: unit ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      CGO_ENABLED: ${{ matrix.cgo_enabled || '1' }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          # setup-go caches the module cache by default, but resolves go.sum
          # from the repository root. This is a multi-module repo with no root
          # go.sum, so without this line it logs
          #   Restore cache failed: Dependencies file is not found
          # as a *warning* and runs with no cache at all -- every job
          # re-downloading its whole dependency graph, every run.
          cache-dependency-path: ${{ matrix.service }}/go.sum
      # Fetch the build list up front, with retries, so one dropped
      # proxy.golang.org stream costs a retry instead of the job. piri is the
      # reason this is not optional: its graph (lotus, curio, specs-actors,
      # boxo) is the largest here, so it draws the most chances to lose.
      - name: download modules
        run: $GITHUB_WORKSPACE/.github/scripts/retry.sh go mod download
      - name: build
        run: go build ${{ matrix.build_flags }} ./...
      - name: vet
        run: go vet ${{ matrix.build_flags }} ./...
      # tidy is retried separately: it walks the test dependencies of
      # dependencies, which `go mod download` does not fetch, so it can still
      # reach the network after the step above. That is how smelt failed.
      - name: tidy (no diff)
        run: |
          $GITHUB_WORKSPACE/.github/scripts/retry.sh go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: test
        run: go test ${{ matrix.build_flags }} ./...
      # Tag-gated packages are invisible to every step above, so a broken
      # import path in them stays green until someone runs the suite by hand.
      # Compiling them (not running them — they need Docker and a live stack)
      # is what keeps that from happening.
      - name: vet tagged suites
        if: matrix.tagged_suites != ''
        run: go vet -tags ${{ matrix.tagged_suites }} ./...
