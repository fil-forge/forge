name: ci

# Per-module build, vet, tidy and test, standalone (GOWORK=off), plus a
# repo-wide gofmt and replace-directive check. No release or publish.
#
# Unfiltered by path on purpose: one job per module and no filter list means
# a new shared module cannot fall out of one and go silently green.
#
# The matrix needs a Docker daemon. Tests in several modules start containers
# through testcontainers, usually via an internal testutil helper rather than
# naming it directly, and none are behind a build tag.

on:
  # Only main: a push to a branch with an open pull request would otherwise
  # run everything twice, once per event. The pull_request event covers
  # branches, and workflow_dispatch covers a branch with no PR yet.
  push:
    branches: [main]
  pull_request:
  # A workflow does not run for the commits that were already present when it
  # first appeared, so this repo's own main arrived unverified. Dispatch makes
  # a run possible without inventing a commit to trigger one.
  workflow_dispatch:

permissions:
  contents: read

env:
  # proxy.golang.org drops HTTP/2 streams mid-transfer (INTERNAL_ERROR);
  # golang/go#51323 has tracked it since 2022 and is still open, unassigned
  # and NeedsInvestigation, so there is no fix to wait for. The default
  # GOPROXY separator is a comma, which falls back to the next entry only on
  # 404/410 -- a dropped stream is not "not found", so the build just fails.
  # A pipe falls back on any error, so the fetch retries against the origin.
  # This is not a trust change: go.sum and the checksum database verify what
  # comes back, whichever source served it.
  GOPROXY: "https://proxy.golang.org|direct"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    # check-assert-released-version.sh test 8 waits out the assertion's own
    # probe cap on a binary that never exits: ~20s today, and ~20 MINUTES if
    # that cap is ever raised, because the test measures elapsed time AFTER the
    # probe returns rather than bounding it. Without this the ceiling is
    # GitHub's 6-hour default. release.yml sets one and says why; so does this.
    timeout-minutes: 15
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: smelt/go.mod
          cache-dependency-path: smelt/go.sum
      - name: every in-repo require has a replace
        run: .github/scripts/check-replaces.sh
      - name: every in-repo module reference uses its monorepo path
        run: .github/scripts/check-module-paths.sh
      - name: every external base image is pinned by digest
        run: .github/scripts/check-base-images.sh
      - name: every pulled compose image is pinned by digest
        run: .github/scripts/check-stack-images.sh
      - name: every pg_isready healthcheck probes TCP
        run: .github/scripts/check-pg-healthchecks.sh
      - name: every goreleaser -X ldflag names a package in its module
        run: .github/scripts/check-goreleaser-ldflags.sh
      - name: the release version assertion fails on a dead ldflag, and passes on a live one
        run: .github/scripts/check-assert-released-version.sh
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt -s clean:"
            echo "$unformatted" | sed 's/^/  /'
            echo "Run: gofmt -s -l . | xargs gofmt -s -w"
            exit 1
          fi
          echo "All Go files are gofmt -s clean."

  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          # piri needs -tags skiff to select curio's FFI-free variants; without
          # it the CGO-free build dies on undefined ffi.* symbols.
          - service: piri
            build_flags: -tags skiff
            cgo_enabled: "0"
          - service: hilt
          - service: ingot
          - service: sprue
          - service: smelt
            tagged_suites: e2e,compat
          - service: delegator
          - service: piri-signing-service
          - service: swarf
          - service: indexing-service
          - service: forgectl
    name: unit ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      CGO_ENABLED: ${{ matrix.cgo_enabled || '1' }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          # setup-go caches the module cache by default, but resolves go.sum
          # from the repository root. This is a multi-module repo with no root
          # go.sum, so without this line it logs
          #   Restore cache failed: Dependencies file is not found
          # as a *warning* and runs with no cache at all -- every job
          # re-downloading its whole dependency graph, every run.
          cache-dependency-path: ${{ matrix.service }}/go.sum
      # Fetch the build list up front so a proxy failure is reported as a
      # download failure, not as a compile error three steps later -- that is
      # how it first presented, as "undefined: X" from a package go never
      # fetched. Retried because GOPROXY's origin fallback (above) covers a
      # bad proxy response but not a connection that dies mid-body. piri
      # draws the most chances to lose: lotus, curio, specs-actors and boxo
      # make its graph the largest here.
      - name: download modules
        run: $GITHUB_WORKSPACE/.github/scripts/retry.sh go mod download
      - name: build
        run: go build ${{ matrix.build_flags }} ./...
      - name: vet
        run: go vet ${{ matrix.build_flags }} ./...
      # staticcheck pins go1.26.x in its own go.mod, and `go install` honours
      # the *target* module's toolchain -- so a plain install builds it with
      # 1.26, which then cannot read a go 1.27.0 module. Build it with the
      # version go.work declares.
      - name: staticcheck
        run: |
          GOTOOLCHAIN=go$(awk '/^go /{print $2; exit}' "$GITHUB_WORKSPACE/go.work") \
            go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ${{ matrix.build_flags }} ./...
      # tidy is retried separately: it walks the test dependencies of
      # dependencies, which `go mod download` does not fetch, so it can still
      # reach the network after the step above. That is how smelt failed.
      - name: tidy (no diff)
        run: |
          $GITHUB_WORKSPACE/.github/scripts/retry.sh go mod tidy
          git diff --exit-code -- go.mod go.sum
      # -race and -shuffle=on, both of which each service's own CI ran.
      # -race requires cgo, so CGO_ENABLED is 1 here regardless of the
      # matrix's value for the build steps above.
      - name: test
        env:
          CGO_ENABLED: "1"
        run: go test ${{ matrix.build_flags }} -race -shuffle=on ./...
      # Tag-gated packages are invisible to every step above, so a broken
      # import path in them stays green until someone runs the suite by hand.
      # Compiling them (not running them — they need Docker and a live stack)
      # is what keeps that from happening.
      #
      # The tag list above is hand-maintained, which is rule 3's failure mode:
      # `compat` was added and this was not, so the new suite compiled nowhere.
      # Until a guard derives it, here is the command that enumerates the class
      # — for every module in go.work, every build tag that unlocks a package
      # an untagged build does not compile. Run it when a suite is added; it
      # reports `smelt e2e` and `smelt compat`, and nothing else in the tree:
      #
      #   for m in $(grep -oE '\./[a-z0-9/-]+' go.work | sed 's|^\./||'); do
      #     tags=$(grep -rhoE '^//go:build [a-z0-9_, ]+' "$m" --include='*.go' \
      #            | sed 's|^//go:build ||' | tr ', ' '\n' | sort -u)
      #     base=$( (cd "$m" && GOWORK=off go list ./...) | sort )
      #     for t in $tags; do
      #       (cd "$m" && GOWORK=off go list -tags "$t" ./... 2>/dev/null) | sort \
      #         | comm -13 <(printf '%s\n' "$base") - | sed "s|^|$m $t |"
      #     done
      #   done
      - name: vet tagged suites
        if: matrix.tagged_suites != ''
        run: go vet -tags ${{ matrix.tagged_suites }} ./...
