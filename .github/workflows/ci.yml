name: CI

# Two tiers, mirroring the old per-repo split but now over one commit:
#
#   unit   per-module, path-filtered, GOWORK=off — each service is still an
#          independent module and is tested as one, in seconds.
#   stack  ONE full-stack run per PR, at the commit under test, with every
#          in-repo service built from the working tree and mounted over the
#          published images.
#
# The stack tier is the whole point of the monorepo. It resolves no binary for
# an in-repo service from a registry image, so there is no floating `:main`
# baseline to go stale and no lockfile to promote — "the stack" is just this
# commit.

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Which services does this diff actually touch? No service module imports
  # another (shared surface lives in libforge), so each filter is just the
  # service's own subtree.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      any: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            piri:
              - 'piri/**'
              - 'docker/**'
              - '.github/workflows/ci.yml'
            hilt:
              - 'hilt/**'
              - 'docker/**'
              - '.github/workflows/ci.yml'
            sprue:
              - 'sprue/**'
              - 'docker/**'
              - '.github/workflows/ci.yml'
            ingot:
              - 'ingot/**'
              - 'docker/**'
              - '.github/workflows/ci.yml'
            smelt:
              - 'smelt/**'
              - 'docker/**'
              - '.github/workflows/ci.yml'

  unit:
    name: unit (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      # Each service is a standalone module and is tested as one. The
      # workspace is a developer convenience; go.mod is the source of truth,
      # and this proves it is sufficient.
      GOWORK: off
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum

      # piri builds CGO-free only with `skiff`, which selects Curio's FFI-free
      # variants; without it the build fails on undefined ffi.* symbols.
      - name: Set build flags
        run: |
          if [ "${{ matrix.service }}" = "piri" ]; then
            echo "GOFLAGS=-tags=skiff" >> "$GITHUB_ENV"
          fi

      - run: go build ./...
      - run: go vet ./...

      # Placeholder gate: no repo-wide linter rules are adopted yet. When they
      # are, they live in ONE root-level config shared by every service — do
      # not add per-service lint configs.
      - name: lint
        run: echo "lint | no repo-wide linter rules adopted yet"

      # A module's go.mod/go.sum must be exactly what tidy produces — drift
      # here is how version skew between the services creeps back in.
      - name: go.mod tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - run: go test ./...

  # One stack run for the whole PR, not one per service. The four in-repo
  # service images are built HERE, from this commit, and handed to the suites
  # through the runner's Docker daemon — never pushed to a registry. The
  # artifact under test is the artifact that ships, packaging included; there
  # is no binary-mounting layer in CI (that stays a local-dev fast path).
  stack:
    name: stack
    needs: [changes, unit]
    if: needs.changes.outputs.any == 'true'
    # Pinned rather than -latest so the Docker version doesn't drift from under
    # us. The runner's preinstalled Docker is 28.x, well past smelt's 25+ floor.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GOWORK: off
      # The images built below, resolved by smelt's compose env plumbing.
      PIRI_IMAGE: forge-ci/piri:${{ github.sha }}
      HILT_IMAGE: forge-ci/hilt:${{ github.sha }}
      INGOT_IMAGE: forge-ci/ingot:${{ github.sha }}
      UPLOAD_IMAGE: forge-ci/sprue:${{ github.sha }}
      # Tells the S3 suite the images above ARE this commit — run them as
      # built, no binary mounts (see forgeStack in smelt/tests/s3).
      SMELT_STACK_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: smelt/go.mod
          cache-dependency-path: smelt/go.sum

      - name: Docker info
        run: |
          docker version
          docker compose version

      - uses: docker/setup-buildx-action@v3

      # All four images at this commit, loaded into the local daemon. The
      # cache scopes are shared with publish-ghcr.yml, so merges to main keep
      # these warm and an unchanged service's build is a near no-op.
      - name: Build piri image
        uses: docker/build-push-action@v6
        with:
          context: piri
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=piri
            BUILD_TAGS=skiff
          load: true
          push: false
          tags: forge-ci/piri:${{ github.sha }}
          cache-from: type=gha,scope=piri
          cache-to: type=gha,mode=max,scope=piri
      - name: Build hilt image
        uses: docker/build-push-action@v6
        with:
          context: hilt
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=hilt
          load: true
          push: false
          tags: forge-ci/hilt:${{ github.sha }}
          cache-from: type=gha,scope=hilt
          cache-to: type=gha,mode=max,scope=hilt
      - name: Build sprue image
        uses: docker/build-push-action@v6
        with:
          context: sprue
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=sprue
          load: true
          push: false
          tags: forge-ci/sprue:${{ github.sha }}
          cache-from: type=gha,scope=sprue
          cache-to: type=gha,mode=max,scope=sprue
      - name: Build ingot image
        uses: docker/build-push-action@v6
        with:
          context: ingot
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=ingot
            MAIN_PKG=./cmd/ingot
          load: true
          push: false
          tags: forge-ci/ingot:${{ github.sha }}
          cache-from: type=gha,scope=ingot
          cache-to: type=gha,mode=max,scope=ingot

      # The suites run sequentially in this one job: each sweeps smeltery-*
      # containers, so two stacks must never share a Docker host.
      - name: Full stack e2e (this commit's images)
        working-directory: smelt
        run: go test -tags e2e -v -timeout 30m -parallel "${SMELT_E2E_MAX_PARALLEL:-1}" ./tests/e2e/...

      - name: S3 gateway system suite
        working-directory: smelt
        run: go test -tags itest -v -timeout 25m ./tests/s3/...

      - name: Dump container state on failure
        if: failure()
        run: |
          mkdir -p /tmp/container-logs
          {
            echo "=== docker ps -a ==="; docker ps -a
            echo; echo "=== docker network ls ==="; docker network ls
            echo; echo "=== docker volume ls ==="; docker volume ls
          } | tee /tmp/container-logs/_overview.txt
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "/tmp/container-logs/$c.log" 2>&1 || true
            echo "::group::$c"
            tail -200 "/tmp/container-logs/$c.log"
            echo "::endgroup::"
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: /tmp/container-logs/
          if-no-files-found: ignore
          retention-days: 7
