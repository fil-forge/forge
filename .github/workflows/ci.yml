name: ci

# Minimal Phase 0 check: each module builds, vets, is tidy, and its tests
# pass, standalone (GOWORK=off). No Docker, no release/publish — that's
# later-phase work. Unfiltered on purpose: with only one job covering every
# module, there's no path-filter list to fall out of sync with a new shared
# module (see forge-consolidation-plan.md's Traps section, #1).

on:
  # Only main: a push to a branch with an open pull request would otherwise
  # run everything twice, once per event. The pull_request event covers
  # branches, and workflow_dispatch covers a branch with no PR yet.
  push:
    branches: [main]
  pull_request:
  # A workflow does not run for the commits that were already present when it
  # first appeared, so this repo's own main arrived unverified. Dispatch makes
  # a run possible without inventing a commit to trigger one.
  workflow_dispatch:

env:
  # proxy.golang.org drops HTTP/2 streams mid-transfer (INTERNAL_ERROR);
  # golang/go#51323 has tracked it since 2022 and is still open, unassigned
  # and NeedsInvestigation, so there is no fix to wait for. The default
  # GOPROXY separator is a comma, which falls back to the next entry only on
  # 404/410 -- a dropped stream is not "not found", so the build just fails.
  # A pipe falls back on any error, so the fetch retries against the origin.
  # This is not a trust change: go.sum and the checksum database verify what
  # comes back, whichever source served it.
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  replaces:
    name: replaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: smelt/go.mod
          cache-dependency-path: smelt/go.sum
      - name: every in-repo require has a replace
        run: .github/scripts/check-replaces.sh
      # go vet does not check formatting, so nothing else here would.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted" | sed 's/^/  /'
            echo "Run: gofmt -l . | xargs gofmt -w"
            exit 1
          fi
          echo "All Go files are gofmt-clean."

  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          # piri needs -tags skiff to select curio's FFI-free variants; without
          # it the CGO-free build dies on undefined ffi.* symbols.
          - service: piri
            build_flags: -tags skiff
            cgo_enabled: "0"
          - service: hilt
          - service: ingot
          - service: sprue
          - service: smelt
            tagged_suites: e2e
          - service: delegator
          - service: piri-signing-service
          # No tagged_suites: unlike hilt and ingot, swarf's itest carries no
          # build tag, so `go test ./...` runs it. It boots one postgres via
          # testcontainers and runs swarf in-process -- not a full stack -- and
          # it deliberately fails rather than skips when Docker is missing in
          # CI, so it cannot go quietly green.
          - service: swarf
    name: unit ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      CGO_ENABLED: ${{ matrix.cgo_enabled || '1' }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          # setup-go caches the module cache by default, but resolves go.sum
          # from the repository root. This is a multi-module repo with no root
          # go.sum, so without this line it logs
          #   Restore cache failed: Dependencies file is not found
          # as a *warning* and runs with no cache at all -- every job
          # re-downloading its whole dependency graph, every run.
          cache-dependency-path: ${{ matrix.service }}/go.sum
      # Fetch the build list up front so a proxy failure is reported as a
      # download failure, not as a compile error three steps later -- that is
      # how it first presented, as "undefined: X" from a package go never
      # fetched. Retried because GOPROXY's origin fallback (above) covers a
      # bad proxy response but not a connection that dies mid-body. piri
      # draws the most chances to lose: lotus, curio, specs-actors and boxo
      # make its graph the largest here.
      - name: download modules
        run: $GITHUB_WORKSPACE/.github/scripts/retry.sh go mod download
      - name: build
        run: go build ${{ matrix.build_flags }} ./...
      - name: vet
        run: go vet ${{ matrix.build_flags }} ./...
      # tidy is retried separately: it walks the test dependencies of
      # dependencies, which `go mod download` does not fetch, so it can still
      # reach the network after the step above. That is how smelt failed.
      - name: tidy (no diff)
        run: |
          $GITHUB_WORKSPACE/.github/scripts/retry.sh go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: test
        run: go test ${{ matrix.build_flags }} ./...
      # Tag-gated packages are invisible to every step above, so a broken
      # import path in them stays green until someone runs the suite by hand.
      # Compiling them (not running them — they need Docker and a live stack)
      # is what keeps that from happening.
      - name: vet tagged suites
        if: matrix.tagged_suites != ''
        run: go vet -tags ${{ matrix.tagged_suites }} ./...
