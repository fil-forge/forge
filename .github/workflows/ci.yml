name: ci

# Minimal Phase 0 check: each module builds, vets, is tidy, and its tests
# pass, standalone (GOWORK=off). No Docker, no release/publish — that's
# later-phase work. Unfiltered on purpose: with only one job covering every
# module, there's no path-filter list to fall out of sync with a new shared
# module (see forge-consolidation-plan.md's Traps section, #1).

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: piri
            build_flags: -tags skiff
            cgo_enabled: "0"
          - service: hilt
            build_flags: ""
            cgo_enabled: "1"
          - service: ingot
            build_flags: ""
            cgo_enabled: "1"
          - service: sprue
            build_flags: ""
            cgo_enabled: "1"
          - service: smelt
            build_flags: ""
            cgo_enabled: "1"
          - service: delegator
            build_flags: ""
            cgo_enabled: "1"
          - service: piri-signing-service
            build_flags: ""
            cgo_enabled: "1"
    name: unit ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      CGO_ENABLED: ${{ matrix.cgo_enabled }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
      - name: build
        run: go build ${{ matrix.build_flags }} ./...
      - name: vet
        run: go vet ${{ matrix.build_flags }} ./...
      - name: tidy (no diff)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: test
        run: go test ${{ matrix.build_flags }} ./...
