name: CI

# Two tiers over one commit:
#
#   unit   per-module, GOWORK=off — every module in the repo is built, vetted,
#          tidy-checked and tested as the standalone module it is, in minutes.
#   stack  ONE full-stack run per PR, at the commit under test, with every
#          in-repo service image built from the working tree and handed to the
#          suites through the runner's Docker daemon — never pushed.
#
# Every module runs on every change. The unit tier used to be path-filtered
# per service, which was sound while no service module imported another and
# the shared surface lived in an external library. It stopped being sound
# when the shared modules (protocol/, internal/, attestation/) and the
# service-to-service dependencies (ingot -> the indexer's query types,
# hilt -> smelt's stack harness) moved
# in-repo: a service's behaviour now depends on directories outside its own
# subtree, and a path filter that misses one skips CI silently and reports
# green. The whole matrix costs minutes of runner time; a silent skip costs a
# broken main.

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Every in-repo module resolves its siblings through replace directives in
  # its own go.mod — the workspace is a developer convenience that CI never
  # uses. A require without a replace resolves through the module proxy to
  # whatever lives at that path, which for github.com/fil-forge/forge/... is
  # the repository root: not a module, and the error is either confusing or
  # absent. This job makes that state impossible to merge.
  replaces:
    name: replace directives · every in-repo require has one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: protocol/go.mod
          cache: false
      - run: .github/scripts/check-replaces.sh

  unit:
    # The check name spells out the gate order so a red X is legible from the
    # PR checks list without clicking through.
    name: unit ${{ matrix.module }} · build,vet,tidy,test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          - protocol
          - internal
          - attestation
          - piri
          - hilt
          - sprue
          - ingot
          - smelt
          - smelt/systems/stress-tester
          - delegator
          - piri-signing-service
          - indexing-service
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      # Each module is standalone and is tested as one. The workspace is a
      # developer convenience; go.mod (with its replace directives) is the
      # source of truth, and this proves it is sufficient.
      GOWORK: off
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # piri builds CGO-free only with `skiff`, which selects Curio's FFI-free
      # variants; without it the build fails on undefined ffi.* symbols.
      - name: Set build flags
        run: |
          if [ "${{ matrix.module }}" = "piri" ]; then
            echo "GOFLAGS=-tags=skiff" >> "$GITHUB_ENV"
          fi

      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

      # The wire contract's codecs are generated (cbor-gen + dag-json-gen). A
      # type edited without regenerating is a silent wire change; a generator
      # that no longer compiles goes unnoticed until someone runs go generate.
      - name: codegen gate
        if: matrix.module == 'protocol' || matrix.module == 'attestation'
        run: make codegen-build gen-check

      # Placeholder gate: no repo-wide linter rules are adopted yet. When they
      # are, they live in ONE root-level config shared by every module — do
      # not add per-module lint configs.
      - name: lint
        run: echo "lint | no repo-wide linter rules adopted yet"

      # A module's go.mod/go.sum must be exactly what tidy produces — drift
      # here is how version skew between the modules creeps back in.
      - name: go.mod tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: go test
        run: go test ./...

  # One stack run for the whole PR, not one per service. Every in-repo service
  # image is built HERE, from this commit, and handed to the suites through
  # the runner's Docker daemon — never pushed to a registry. The artifact
  # under test is the artifact that ships, packaging included; there is no
  # binary-mounting layer in CI (that stays a local-dev fast path).
  stack:
    name: stack · images,e2e,s3-suite
    needs: [replaces, unit]
    # Pinned rather than -latest so the Docker version doesn't drift from under
    # us. The runner's preinstalled Docker is 28.x, well past smelt's 25+ floor.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOWORK: off
      # The images built below, resolved by smelt's compose env plumbing.
      PIRI_IMAGE: forge-ci/piri:${{ github.sha }}
      HILT_IMAGE: forge-ci/hilt:${{ github.sha }}
      INGOT_IMAGE: forge-ci/ingot:${{ github.sha }}
      UPLOAD_IMAGE: forge-ci/sprue:${{ github.sha }}
      DELEGATOR_IMAGE: forge-ci/delegator:${{ github.sha }}
      SIGNER_IMAGE: forge-ci/piri-signing-service:${{ github.sha }}
      INDEXER_IMAGE: forge-ci/indexing-service:${{ github.sha }}
      # Tells the S3 suite the images above ARE this commit — run them as
      # built, no binary mounts (see forgeStack in smelt/tests/s3).
      SMELT_STACK_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: smelt/go.mod
          cache-dependency-path: smelt/go.sum

      - name: Docker info
        run: |
          docker version
          docker compose version

      - uses: docker/setup-buildx-action@v3

      # Every service image at this commit, loaded into the local daemon. The
      # build context is the repository root (the services reach the shared
      # modules through replace directives, so a per-service context cannot
      # see them). The cache scopes are shared with publish-ghcr.yml, so
      # merges to main keep these warm and an unchanged service's build is a
      # near no-op.
      - name: Build piri image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=piri
            BUILD_TAGS=skiff
          load: true
          push: false
          tags: forge-ci/piri:${{ github.sha }}
          cache-from: type=gha,scope=piri
          cache-to: type=gha,mode=max,scope=piri
      - name: Build hilt image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=hilt
          load: true
          push: false
          tags: forge-ci/hilt:${{ github.sha }}
          cache-from: type=gha,scope=hilt
          cache-to: type=gha,mode=max,scope=hilt
      - name: Build sprue image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=sprue
          load: true
          push: false
          tags: forge-ci/sprue:${{ github.sha }}
          cache-from: type=gha,scope=sprue
          cache-to: type=gha,mode=max,scope=sprue
      - name: Build ingot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=ingot
            MAIN_PKG=./cmd/ingot
          load: true
          push: false
          tags: forge-ci/ingot:${{ github.sha }}
          cache-from: type=gha,scope=ingot
          cache-to: type=gha,mode=max,scope=ingot
      # The satellites keep the binary names their compose files and smelt's
      # workspace table expect (BIN), which differ from their directory names.
      - name: Build delegator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=delegator
            MAIN_PKG=.
            BIN=registrar
          load: true
          push: false
          tags: forge-ci/delegator:${{ github.sha }}
          cache-from: type=gha,scope=delegator
          cache-to: type=gha,mode=max,scope=delegator
      - name: Build piri-signing-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=piri-signing-service
            MAIN_PKG=.
            BIN=signer
          load: true
          push: false
          tags: forge-ci/piri-signing-service:${{ github.sha }}
          cache-from: type=gha,scope=piri-signing-service
          cache-to: type=gha,mode=max,scope=piri-signing-service
      - name: Build indexing-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          build-args: |
            SERVICE=indexing-service
            BIN=indexer
          load: true
          push: false
          tags: forge-ci/indexing-service:${{ github.sha }}
          cache-from: type=gha,scope=indexing-service
          cache-to: type=gha,mode=max,scope=indexing-service

      # The suites run sequentially in this one job: each sweeps smeltery-*
      # containers, so two stacks must never share a Docker host.
      # Both suites pipe through group-go-tests.awk (collapsible log group per
      # top-level test) and tee a raw copy for the job summary below. shell:
      # bash is explicit because that is what turns on pipefail — without it a
      # failing go test would vanish behind the awk pipe's exit status.
      - name: Full stack e2e (this commit's images)
        working-directory: smelt
        shell: bash
        run: go test -tags e2e -v -timeout 30m -parallel "${SMELT_E2E_MAX_PARALLEL:-1}" ./tests/e2e/... 2>&1 | tee /tmp/suite-e2e.log | awk -f "$GITHUB_WORKSPACE/.github/scripts/group-go-tests.awk"

      - name: S3 gateway system suite
        working-directory: smelt
        shell: bash
        run: go test -tags itest -v -timeout 25m ./tests/s3/... 2>&1 | tee /tmp/suite-s3.log | awk -f "$GITHUB_WORKSPACE/.github/scripts/group-go-tests.awk"

      # At-a-glance readout on the run's overview page: which images were
      # built and each suite's case counts, without opening a single log.
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Stack tier"
            echo
            echo "Every service image is built from **this commit** (\`docker/Dockerfile\`), loaded into the runner's daemon — never pushed — and the suites boot the stack on them as-built."
            echo
            echo "| image | target | tag |"
            echo "|---|---|---|"
            for s in piri hilt sprue ingot delegator piri-signing-service indexing-service; do
              echo "| $s | prod | \`forge-ci/$s:${GITHUB_SHA}\` |"
            done
            echo
            echo "| suite | passed | failed | skipped |"
            echo "|---|---|---|---|"
            for entry in "e2e smoke;/tmp/suite-e2e.log" "s3 system;/tmp/suite-s3.log"; do
              name="${entry%;*}"; log="${entry#*;}"
              if [ -f "$log" ]; then
                p=$(grep -cE '^[[:space:]]*--- PASS:' "$log" || true)
                f=$(grep -cE '^[[:space:]]*--- FAIL:' "$log" || true)
                k=$(grep -cE '^[[:space:]]*--- SKIP:' "$log" || true)
                echo "| $name | $p | $f | $k |"
              else
                echo "| $name | – | – | did not run |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump container state on failure
        if: failure()
        run: |
          mkdir -p /tmp/container-logs
          {
            echo "=== docker ps -a ==="; docker ps -a
            echo; echo "=== docker network ls ==="; docker network ls
            echo; echo "=== docker volume ls ==="; docker volume ls
          } | tee /tmp/container-logs/_overview.txt
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "/tmp/container-logs/$c.log" 2>&1 || true
            echo "::group::$c"
            tail -200 "/tmp/container-logs/$c.log"
            echo "::endgroup::"
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: /tmp/container-logs/
          if-no-files-found: ignore
          retention-days: 7
