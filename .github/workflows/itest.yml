name: itest

# Runs hilt's and ingot's integration suites, which boot the Forge stack in
# Docker through smelt and drive the service under test through it.
#
# They existed before this workflow and were never run. ci.yml compiled them
# behind the `itest` build tag and discarded the result -- its own comment said
# so -- which meant a suite could rot for weeks without anything going red. Each
# is now its own Go module, so it gets a job instead of a build tag.
#
# What a run proves is worth naming, because it is not what e2e.yml proves.
# Both suites run the commit under test: every in-repo image is built from
# HEAD here as well (see the env block below), so the difference is not whose
# code runs but what the suite looks at.
#
# A suite here goes deep on one service's own contract -- hilt's subtests are
# all access keys and revocation, ingot's are all its own surface -- and
# treats the rest of the stack as scaffolding that has to be there. e2e.yml
# goes wide on the assembly instead: upload and retrieve, end to end, which
# is the only place a broken Dockerfile, entrypoint or compose wiring can
# show up at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # See ci.yml: the default comma separator falls back to the origin only on
  # 404/410, so a dropped proxy stream fails the job outright.
  GOPROXY: "https://proxy.golang.org|direct"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  itest:
    strategy:
      fail-fast: false
      # One suite per runner, and it must stay that way: each TestMain calls
      # stack.CleanupLeaked, which removes every container and volume whose
      # compose project starts `smeltery-` -- including another suite's live
      # ones. pkg/stack/cleanup.go says as much ("For single-suite test
      # machines this is safe"). A matrix gives each job its own Docker host;
      # folding these into one job would have them tear each other down.
      # ingot is split across runners because its cost is stack boots, not
      # tests: 13 top-level tests, 13 boots, ~1-2 min each (stack_test.go says
      # so in its own log line), which was 21 of the job's 28 minutes. Splitting
      # divides that almost linearly. hilt runs whole -- it is ~8 minutes.
      #
      # Which tests each shard runs is DERIVED, not listed: see the itest step.
      # A hand-written -run regex per shard is a list a new test can fall out
      # of, and it would fall out silently, which is the shape rule 5 exists
      # to catch.
      matrix:
        include:
          - {service: hilt,  name: hilt,      shard: 1, shards: 1}
          - {service: ingot, name: ingot 1/3, shard: 1, shards: 3}
          - {service: ingot, name: ingot 2/3, shard: 2, shards: 3}
          - {service: ingot, name: ingot 3/3, shard: 3, shards: 3}
    name: itest ${{ matrix.name }}
    # Pinned rather than -latest so the Docker version cannot drift underneath
    # the harness, which requires 25+. Same reason as e2e.yml.
    runs-on: ubuntu-24.04
    # 45 was set when ingot ran whole and landed near 28 minutes, leaving
    # little margin. Sharding took the longest job to roughly half that, so
    # this is now generous rather than tight -- left as it is because the Go
    # timeout below is the one that matters: it fires first on a hang and
    # dumps every goroutine, where a runner kill at the cap gives nothing.
    # Lowering the cap is a separate judgement and wants its own measurement.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ matrix.service }}/itest
    env:
      # Each itest module resolves its service and smelt through its own
      # `replace`, so it stands alone exactly as ci.yml requires of every other
      # module -- and so the binary it builds is the one the Dockerfile would.
      GOWORK: "off"
      # Consumed by pkg/stack.OptionsFromEnv, which the suites append after
      # WithPublishedImages so these win. Every one is built by the step below.
      #
      # The suite's subject is one service's own contract; the rest of the
      # stack is scaffolding. Scaffolding on a mutable tag makes a red
      # ambiguous -- it happened, and it cost an investigation to establish
      # that nothing in the tree had changed and hilt:main had moved instead.
      # Whether we still work against what is *deployed* is a real question,
      # but a different one, and Phase 1's compat suite is where it belongs.
      PIRI_IMAGE: forge/piri:head
      HILT_IMAGE: forge/hilt:head
      INGOT_IMAGE: forge/ingot:head
      UPLOAD_IMAGE: forge/sprue:head
      DELEGATOR_IMAGE: forge/delegator:head
      SIGNER_IMAGE: forge/piri-signing-service:head
      SWARF_IMAGE: forge/swarf:head
      INDEXER_IMAGE: forge/indexing-service:head
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/itest/go.mod
          cache-dependency-path: ${{ matrix.service }}/itest/go.sum

      - name: download modules
        run: $GITHUB_WORKSPACE/.github/scripts/retry.sh go mod download
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          GOTOOLCHAIN=go$(awk '/^go /{print $2; exit}' "$GITHUB_WORKSPACE/go.work") \
            go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - name: tidy (no diff)
        run: |
          $GITHUB_WORKSPACE/.github/scripts/retry.sh go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: docker version
        run: |
          docker version
          docker compose version

      # Layer-cached, unlike `images.yml`, and the difference is deliberate.
      #
      # `images.yml` builds these same 8 images from cold on every pull
      # request and every push to main, on the same events as this workflow.
      # It is the canary: its own header says the point there is "to provoke
      # build failures, not to avoid them", and a cache hit would mean the
      # build did not run. That argument is about a job whose product *is* the
      # build. Here the build is a means to running the suite, and the canary
      # has already proved the cold build on this very commit, in parallel.
      #
      # So: `images.yml` stays cold, these two ride the cache. If a Dockerfile
      # breaks, `images.yml` goes red on the same commit and this job's cache
      # cannot hide it.
      #
      # `docker/build-push-action` rather than the shell loop it replaces,
      # because `type=gha` needs ACTIONS_RUNTIME_TOKEN and ACTIONS_CACHE_URL,
      # which GitHub does not export to `run:` steps -- the usual fix is a
      # third-party action to export them, and this repo already trusts and
      # uses these two in `images.yml`. It also leaves exactly one way to build
      # an image here instead of two that can drift.
      #
      # Scope is per service and shared with e2e.yml on purpose: they build the
      # same 8 images from the same commit, so whichever job runs first warms
      # the other. Branch scoping is GitHub's: a pull request reads its base
      # branch's cache and writes its own, so main's runs are what warm it.
      #
      # A service builds with the repository root as context when its go.mod
      # carries a `replace => ../<svc>`, and with its own directory otherwise.
      # Each Dockerfile's header explains its COPY list.
      #
      # The service under test keeps its bind-mounted binary as well
      # (WithServiceBinary in stack_test.go): same code either way, and it is
      # what makes a local `make itest` fast, with no image build at all.
      - uses: docker/setup-buildx-action@v3

      - name: build piri
        uses: docker/build-push-action@v6
        with:
          context: .
          file: piri/Dockerfile
          target: prod
          push: false
          load: true
          tags: forge/piri:head
          cache-from: type=gha,scope=piri
          cache-to: type=gha,scope=piri,mode=max
      - name: build hilt
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hilt/Dockerfile
          target: prod
          push: false
          load: true
          tags: forge/hilt:head
          cache-from: type=gha,scope=hilt
          cache-to: type=gha,scope=hilt,mode=max
      - name: build ingot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ingot/Dockerfile
          target: prod
          push: false
          load: true
          tags: forge/ingot:head
          cache-from: type=gha,scope=ingot
          cache-to: type=gha,scope=ingot,mode=max
      - name: build sprue
        uses: docker/build-push-action@v6
        with:
          context: sprue
          file: sprue/Dockerfile
          target: prod
          push: false
          load: true
          tags: forge/sprue:head
          cache-from: type=gha,scope=sprue
          cache-to: type=gha,scope=sprue,mode=max
      - name: build delegator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: delegator/Dockerfile
          target: prod
          push: false
          load: true
          tags: forge/delegator:head
          cache-from: type=gha,scope=delegator
          cache-to: type=gha,scope=delegator,mode=max
      - name: build piri-signing-service
        uses: docker/build-push-action@v6
        with:
          context: piri-signing-service
          file: piri-signing-service/Dockerfile
          target: prod
          push: false
          load: true
          tags: forge/piri-signing-service:head
          cache-from: type=gha,scope=piri-signing-service
          cache-to: type=gha,scope=piri-signing-service,mode=max
      - name: build swarf
        uses: docker/build-push-action@v6
        with:
          context: swarf
          file: swarf/Dockerfile
          target: prod
          push: false
          load: true
          tags: forge/swarf:head
          cache-from: type=gha,scope=swarf
          cache-to: type=gha,scope=swarf,mode=max
      - name: build indexing-service
        uses: docker/build-push-action@v6
        with:
          context: indexing-service
          file: indexing-service/Dockerfile
          target: prod
          push: false
          load: true
          tags: forge/indexing-service:head
          cache-from: type=gha,scope=indexing-service
          cache-to: type=gha,scope=indexing-service,mode=max
      - name: image list
        run: docker image ls --filter 'reference=forge/*:head'

      # -count=1 is load-bearing, not a style choice. setup-go restores GOCACHE,
      # which holds Go's test-result cache, and a suite whose inputs are
      # unchanged gets replayed from it -- `ok ... (cached)` in 26 seconds,
      # without booting anything. The stack is external state Go cannot see, so
      # a cached pass says nothing about whether it still works. This is the
      # silent green this workflow exists to remove; it was here on day one.
      #
      # Never retried, deliberately: a retry here would mask a flaky suite,
      # which is the one thing this job exists to see.
      - name: itest
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          # Derive this shard's tests from the binary rather than listing them
          # here. Round-robin over the sorted names, so a test added later
          # lands in a shard by itself; a hand-written -run regex is a list a
          # new test falls out of, and it falls out silently -- a green job
          # that ran nothing looks exactly like a green job that ran
          # everything. `shards: 1` selects all of them, so hilt takes this
          # same path unsharded (NR % 1 is always 0).
          #
          # Cost here is one stack boot per top-level test, so a split by test
          # count is a split by time; nothing cleverer is needed.
          all=$(go test -list '^Test' ./... | grep '^Test' | sort)
          mine=$(printf '%s\n' "$all" | awk -v k="$SHARD" -v s="$SHARDS" 'NR % s == k % s')
          if [ -z "$mine" ]; then
            echo "::error::shard $SHARD/$SHARDS matched no tests -- the suite has fewer than $SHARDS, or -list failed"
            exit 1
          fi
          echo "::group::shard $SHARD/$SHARDS runs $(printf '%s\n' "$mine" | wc -l) of $(printf '%s\n' "$all" | wc -l)"
          printf '%s\n' "$mine"
          echo "::endgroup::"
          go test -count=1 -v -timeout 25m -run "^($(printf '%s\n' "$mine" | paste -sd'|' -))$" ./...

      - name: dump container state on failure
        if: failure()
        run: |
          mkdir -p /tmp/container-logs
          {
            echo "=== docker ps -a ==="; docker ps -a
            echo; echo "=== docker volume ls ==="; docker volume ls
          } | tee /tmp/container-logs/_overview.txt
          for c in $(docker ps -aq); do
            echo "::group::$c"
            docker logs "$c" 2>&1 | tail -200 | tee "/tmp/container-logs/$c.log"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: itest-${{ matrix.service }}-container-logs
          path: /tmp/container-logs
          retention-days: 7
