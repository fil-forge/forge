# SA4006 is off for now, deliberately and temporarily. MONOREPO_TODO.md has
# the entry for turning it back on.
#
# One finding, in generated code: dag-json-gen emits `written++` after every
# field and guards the *next* field with `if written > 0 { WriteComma() }`, so
# the increment after the last field has no reader
# (indexing-service/pkg/service/queryresult/json_gen.go). The JSON is correct.
#
# The obvious fix -- run the staticcheck the polyrepo ran -- is not available.
# The shared go-check workflow picks staticcheck from a table keyed by Go minor
# version, and indexing-service was go 1.25.7, so it got 2025.1.1. Unifying the
# libforge pin moved it to go 1.27.0, which the table has no key for, so it
# falls through to `latest`. Neither older version can be used here: 2025.1.1
# and 2026.1 both fail on every package with "export data version 4 is greater
# than maximum supported version 2", because they predate Go 1.27. The chain is
# forced -- the libforge pin requires go >= 1.27.0, and only 2026.2.1 reads it.
#
# So this is the newer linter reporting a true positive, suppressed rather than
# triaged, because triaging it says nothing about whether the monorepo works.
#
# At the root rather than in indexing-service/pkg/service/queryresult/, where
# it started: that directory is inside a subtree prefix, so a file there is
# permanent local divergence that every future `git subtree pull` of
# indexing-service has to carry. This is one visible file in our own territory,
# and one place to revert.
#
# "inherit" keeps staticcheck's default set -- "all" would turn on the ST
# checks it disables by default, which several packages would then fail.
#
# The cost: SA4006 is off everywhere, not just where it fired. It fires exactly
# once in thirteen modules today, so nothing is lost now; that stops being true
# the longer this stays.
checks = ["inherit", "-SA4006"]
