version: 2

project_name: piri

builds:
  - id: piri
    main: ./cmd
    binary: piri
    ldflags:
      # Sets the version variable in the build package to the build version prefixed with a 'v'
      # Sets the main.date to a static date for checksum verification. See https://goreleaser.com/customization/builds/#reproducible-builds.
      - -s -w -X github.com/fil-forge/forge/piri/pkg/build.version=v{{.Version}} -X github.com/fil-forge/forge/piri/pkg/build.Commit={{.Commit}} -X github.com/fil-forge/forge/piri/pkg/build.Date={{.CommitDate}} -X github.com/fil-forge/forge/piri/pkg/build.BuiltBy=goreleaser
    flags:
      # Required, not optional: `skiff` selects Curio's FFI-free variants, which
      # is what makes the CGO_ENABLED=0 build below possible at all. Without it
      # the build fails on undefined ffi.* symbols in curio/lib/ffiselect and
      # harmony/resources/ffigpu. Mirrors the Makefile's TAGS.
      - -tags=skiff
    goos:
      - linux
      - darwin
    goarch:
      - 'amd64'
      - 'arm64'
    # Change to a static date for checksum verification. See https://goreleaser.com/customization/builds/#reproducible-builds.
    mod_timestamp: '{{.CommitTimestamp}}'
    env:
      - CGO_ENABLED=0

universal_binaries:
  - replace: true

archives:
  - format_overrides:
      - goos: darwin
        formats: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}mac_os
      {{- else }}{{ .Os }}{{ end }}_{{ .Arch }}

release:
  # Disabled on purpose. The monorepo tags releases as <service>/vX.Y.Z, which
  # goreleaser OSS cannot address: it derives the release from the parsed semver
  # tag, and "piri/v1.2.3" is not valid semver. The release workflow therefore
  # creates the prefixed GitHub release and uploads dist/ artifacts with `gh`,
  # leaving goreleaser to do what it does well here -- build the cross-platform
  # binaries and push the multi-arch images.
  disable: true

changelog:
  disable: true

dockers:
  # AMD64 image
  - image_templates:
      - "ghcr.io/fil-forge/forge/piri:{{ .Version }}-amd64"
    dockerfile: ../docker/Dockerfile.release
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=SERVICE=piri"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
    goarch: amd64

  # ARM64 image
  - image_templates:
      - "ghcr.io/fil-forge/forge/piri:{{ .Version }}-arm64"
    dockerfile: ../docker/Dockerfile.release
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=SERVICE=piri"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/fil-forge/forge/piri:{{ .Version }}"
    image_templates:
      - "ghcr.io/fil-forge/forge/piri:{{ .Version }}-amd64"
      - "ghcr.io/fil-forge/forge/piri:{{ .Version }}-arm64"
